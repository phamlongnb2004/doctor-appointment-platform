<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Newsletter Endpoint Debug Test</h1>
    
    <div class="test-section">
        <h3>Test 1: Check Backend Health</h3>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Test 2: Check Newsletter Endpoint (GET)</h3>
        <button onclick="testNewsletterGet()">Test GET /api/newsletter/subscribers</button>
        <div id="get-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Test 3: Subscribe to Newsletter (POST)</h3>
        <input type="email" id="test-email" placeholder="test@example.com" value="test@example.com" style="padding: 8px; width: 300px;">
        <button onclick="testSubscribe()">Test POST /api/newsletter/subscribe</button>
        <div id="subscribe-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Test 4: Check All API Endpoints</h3>
        <button onclick="testAllEndpoints()">Test Multiple Endpoints</button>
        <div id="all-result" class="result"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://doctor-appointment-backend-mq2p.onrender.com';

        function displayResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `result ${type}`;
        }

        async function testHealth() {
            displayResult('health-result', 'Testing...', 'info');
            try {
                const response = await fetch(`${BACKEND_URL}/api/test/health`);
                const data = await response.text();
                displayResult('health-result', 
                    `Status: ${response.status}\nResponse: ${data}`, 
                    response.ok ? 'success' : 'error'
                );
            } catch (error) {
                displayResult('health-result', `Error: ${error.message}`, 'error');
            }
        }

        async function testNewsletterGet() {
            displayResult('get-result', 'Testing...', 'info');
            try {
                const response = await fetch(`${BACKEND_URL}/api/newsletter/subscribers`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                displayResult('get-result', 
                    `Status: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 
                    response.ok ? 'success' : 'error'
                );
            } catch (error) {
                displayResult('get-result', `Error: ${error.message}`, 'error');
            }
        }

        async function testSubscribe() {
            const email = document.getElementById('test-email').value;
            displayResult('subscribe-result', 'Testing...', 'info');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/newsletter/subscribe`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        name: 'Test User',
                        phone: '0123456789'
                    })
                });
                
                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }
                
                displayResult('subscribe-result', 
                    `Status: ${response.status}\nContent-Type: ${contentType}\nResponse: ${typeof data === 'object' ? JSON.stringify(data, null, 2) : data}`, 
                    response.ok ? 'success' : 'error'
                );
            } catch (error) {
                displayResult('subscribe-result', `Error: ${error.message}\nStack: ${error.stack}`, 'error');
            }
        }

        async function testAllEndpoints() {
            displayResult('all-result', 'Testing multiple endpoints...', 'info');
            
            const endpoints = [
                { method: 'GET', url: '/api/test/health', name: 'Health Check' },
                { method: 'GET', url: '/api/cms/site-settings', name: 'Site Settings' },
                { method: 'GET', url: '/api/newsletter/subscribers', name: 'Newsletter Subscribers' },
                { method: 'POST', url: '/api/newsletter/subscribe', name: 'Newsletter Subscribe', body: { email: 'test@test.com' } }
            ];
            
            let results = '';
            
            for (const endpoint of endpoints) {
                try {
                    const options = {
                        method: endpoint.method,
                        headers: { 'Content-Type': 'application/json' }
                    };
                    
                    if (endpoint.body) {
                        options.body = JSON.stringify(endpoint.body);
                    }
                    
                    const response = await fetch(`${BACKEND_URL}${endpoint.url}`, options);
                    results += `\n${endpoint.name} (${endpoint.method} ${endpoint.url}):\n`;
                    results += `  Status: ${response.status} ${response.statusText}\n`;
                    
                    if (response.ok) {
                        results += `  ✓ SUCCESS\n`;
                    } else {
                        results += `  ✗ FAILED\n`;
                    }
                } catch (error) {
                    results += `\n${endpoint.name}:\n  ✗ ERROR: ${error.message}\n`;
                }
            }
            
            displayResult('all-result', results, 'info');
        }

        // Auto-run health check on load
        window.onload = () => {
            testHealth();
        };
    </script>
</body>
</html>
