<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test SendGrid Newsletter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1890ff; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #096dd9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .verify-section { display: none; margin-top: 20px; }
        .code-input {
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test SendGrid Newsletter</h1>
        <p class="subtitle">Test newsletter subscription với SendGrid API</p>

        <!-- Subscribe Form -->
        <div id="subscribeForm">
            <input type="email" id="email" placeholder="Email của bạn" required>
            <input type="text" id="name" placeholder="Tên của bạn" required>
            <input type="tel" id="phone" placeholder="Số điện thoại" required>
            <button onclick="subscribe()">📧 Đăng ký nhận tin</button>
        </div>

        <!-- Verify Form -->
        <div id="verifySection" class="verify-section">
            <h3>✉️ Check email của bạn!</h3>
            <p>Nhập mã 6 số từ email:</p>
            <input type="text" id="code" class="code-input" placeholder="000000" maxlength="6" required>
            <button onclick="verify()">✅ Xác nhận</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = 'https://doctor-appointment-backend-mq2p.onrender.com/api';
        let currentEmail = '';

        async function subscribe() {
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            if (!email || !name || !phone) {
                showResult('Vui lòng điền đầy đủ thông tin!', 'error');
                return;
            }

            currentEmail = email;
            showResult('⏳ Đang gửi email...', 'info');

            try {
                const response = await fetch(`${API_URL}/newsletter/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name, phone })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(`✅ ${data.message}\n\n📧 Check email: ${email}\nNhập mã 6 số vào form bên dưới!`, 'success');
                    document.getElementById('subscribeForm').style.display = 'none';
                    document.getElementById('verifySection').style.display = 'block';
                } else {
                    showResult(`❌ Lỗi: ${data.message || 'Không thể đăng ký'}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Lỗi kết nối: ${error.message}`, 'error');
            }
        }

        async function verify() {
            const code = document.getElementById('code').value;

            if (!code || code.length !== 6) {
                showResult('Vui lòng nhập mã 6 số!', 'error');
                return;
            }

            showResult('⏳ Đang xác nhận...', 'info');

            try {
                const response = await fetch(`${API_URL}/newsletter/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, code })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(`🎉 ${data.message}\n\n✅ Xác nhận thành công!\n📧 Check email để nhận thông báo chào mừng!`, 'success');
                    document.getElementById('verifySection').style.display = 'none';
                } else {
                    showResult(`❌ Lỗi: ${data.message || 'Mã không đúng'}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Lỗi kết nối: ${error.message}`, 'error');
            }
        }

        function showResult(message, type) {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }
    </script>
</body>
</html>
