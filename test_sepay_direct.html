<!DOCTYPE html>
<html>
<head>
    <title>Test SePay Direct</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Test SePay Payment Form</h1>
    <p>Click button để test thanh toán trực tiếp với SePay sandbox</p>
    
    <form id="sePayForm" method="POST" action="https://pay-sandbox.sepay.vn/v1/checkout/init">
        <input type="hidden" name="merchant" value="SP-TEST-PT873684">
        <input type="hidden" name="operation" value="PURCHASE">
        <input type="hidden" name="payment_method" value="BANK_TRANSFER">
        <input type="hidden" name="order_amount" value="10000">
        <input type="hidden" name="currency" value="VND">
        <input type="hidden" name="order_invoice_number" value="TEST-DIRECT-001">
        <input type="hidden" name="order_description" value="Test thanh toan truc tiep">
        <input type="hidden" name="success_url" value="https://example.com/success">
        <input type="hidden" name="error_url" value="https://example.com/error">
        <input type="hidden" name="cancel_url" value="https://example.com/cancel">
        <!-- Signature sẽ được tính bằng JS -->
        <input type="hidden" name="signature" id="signature" value="">
        
        <button type="button" onclick="calculateAndSubmit()">Test Payment</button>
    </form>

    <div id="debug" style="margin-top: 20px; padding: 10px; background: #f0f0f0;">
        <h3>Debug Info:</h3>
        <pre id="debugInfo"></pre>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        async function calculateAndSubmit() {
            const form = document.getElementById('sePayForm');
            const formData = new FormData(form);
            
            // Lấy tất cả fields trừ signature
            const fields = {};
            for (let [key, value] of formData.entries()) {
                if (key !== 'signature') {
                    fields[key] = value;
                }
            }
            
            // Danh sách field được sign
            const signedFieldNames = [
                'merchant', 'env', 'operation', 'payment_method', 'order_amount',
                'currency', 'order_invoice_number', 'order_description', 'customer_id',
                'agreement_id', 'agreement_name', 'agreement_type',
                'agreement_payment_frequency', 'agreement_amount_per_payment',
                'success_url', 'error_url', 'cancel_url', 'order_id'
            ];
            
            // Lọc và tạo signed parts
            const signedParts = [];
            for (let key in fields) {
                if (signedFieldNames.includes(key) && fields[key]) {
                    signedParts.push(`${key}=${fields[key]}`);
                }
            }
            
            const dataString = signedParts.join(',');
            
            // Tính HMAC-SHA256
            const secretKey = 'spsk_test_YtN9NC2N9adiW58jM8CUnBNd95pVtZUK';
            const hash = CryptoJS.HmacSHA256(dataString, secretKey);
            const signature = CryptoJS.enc.Base64.stringify(hash);
            
            // Set signature
            document.getElementById('signature').value = signature;
            
            // Debug info
            const debugInfo = {
                fields: fields,
                signedParts: signedParts,
                dataString: dataString,
                signature: signature
            };
            document.getElementById('debugInfo').textContent = JSON.stringify(debugInfo, null, 2);
            
            // Submit form
            if (confirm('Submit form to SePay?')) {
                form.submit();
            }
        }
    </script>
</body>
</html>
