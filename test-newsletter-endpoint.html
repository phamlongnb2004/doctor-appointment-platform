<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Newsletter Endpoint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: #40a9ff;
        }
        button:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 4px;
            display: none;
        }
        .result.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
            display: block;
        }
        .result.error {
            background: #fff2e8;
            border: 1px solid #ffbb96;
            color: #ff4d4f;
            display: block;
        }
        .result h3 {
            margin-top: 0;
        }
        .result pre {
            background: rgba(0,0,0,0.05);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .info {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .info h3 {
            margin-top: 0;
            color: #1890ff;
        }
        .info ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        .info li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Newsletter Endpoint</h1>
        <p class="subtitle">Test trực tiếp endpoint newsletter subscription</p>

        <div class="info">
            <h3>ℹ️ Thông Tin</h3>
            <ul>
                <li><strong>Backend URL:</strong> https://doctor-appointment-backend-mq2p.onrender.com</li>
                <li><strong>Endpoint:</strong> POST /api/newsletter/subscribe</li>
                <li><strong>Frontend URL:</strong> https://doctor-appointment-frontend-ujug.onrender.com</li>
            </ul>
        </div>

        <form id="testForm">
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" value="test@example.com" required>
            </div>

            <div class="form-group">
                <label for="name">Tên</label>
                <input type="text" id="name" name="name" value="Test User">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" value="0123456789">
            </div>

            <button type="submit" id="submitBtn">Test Endpoint</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Testing...';
            resultDiv.style.display = 'none';

            try {
                console.log('🔵 Testing endpoint...');
                console.log('URL:', 'https://doctor-appointment-backend-mq2p.onrender.com/api/newsletter/subscribe');
                console.log('Data:', { email, name, phone });

                const response = await fetch('https://doctor-appointment-backend-mq2p.onrender.com/api/newsletter/subscribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'https://doctor-appointment-frontend-ujug.onrender.com'
                    },
                    body: JSON.stringify({
                        email: email,
                        name: name,
                        phone: phone
                    })
                });

                console.log('🔵 Response status:', response.status);
                console.log('🔵 Response headers:', response.headers);

                const data = await response.json();
                console.log('🔵 Response data:', data);

                if (response.ok) {
                    // Success
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Success - Status ${response.status}</h3>
                        <p><strong>Message:</strong> ${data.message || 'Success'}</p>
                        <p><strong>Email:</strong> ${data.email || email}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #b7eb8f;">
                            <strong>✅ Endpoint hoạt động!</strong><br>
                            Kiểm tra email để lấy mã xác nhận 6 số.
                        </p>
                    `;
                } else {
                    // Error response
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Error - Status ${response.status}</h3>
                        <p><strong>Error:</strong> ${data.error || data.message || 'Unknown error'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Network Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <pre>${error.stack}</pre>
                    <p style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffbb96;">
                        <strong>Nguyên nhân có thể:</strong><br>
                        1. Backend service đang down<br>
                        2. CORS configuration chưa đúng<br>
                        3. Endpoint không tồn tại (404)<br>
                        4. Network connection issue
                    </p>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Test Endpoint';
            }
        });
    </script>
</body>
</html>
