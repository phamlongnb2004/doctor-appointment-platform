spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Update schema without dropping tables
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
        use_sql_comments: true
        connection:
          characterEncoding: utf-8
          CharSet: utf-8
          useUnicode: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  mail:
    host: smtp.gmail.com
    port: 465
    username: doctor.appointment.platform@gmail.com
    password: scnv gwyd ibxp zuzh
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.gmail.com
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    default-encoding: UTF-8

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  upload:
    path: /tmp/uploads
  base-url: ${APP_BASE_URL:https://doctor-appointment-backend-mq2p.onrender.com}
  frontend-url: ${FRONTEND_URL:https://doctor-appointment-frontend-ujug.onrender.com}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:true}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:noreply@medlatec.com}
  from-name: ${SENDGRID_FROM_NAME:MEDLATEC}

sepay:
  merchant-id: ${SEPAY_MERCHANT_ID:YOUR_MERCHANT_ID}
  secret-key: ${SEPAY_SECRET_KEY:YOUR_MERCHANT_SECRET_KEY}
  env: ${SEPAY_ENV:sandbox}
  checkout-url: ${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
  ipn-url: ${SEPAY_IPN_URL:https://doctor-appointment-backend-mq2p.onrender.com/api/orders/sepay/ipn}

logging:
  level:
    root: INFO
    com.doctorappointment: INFO
