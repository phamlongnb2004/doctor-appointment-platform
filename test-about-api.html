<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test About API</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 12px 24px; background: #1890ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #096dd9; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 6px; overflow-x: auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 6px; }
        .error { color: #f5222d; background: #fff1f0; padding: 15px; border-radius: 6px; }
        .success { color: #52c41a; background: #f6ffed; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test About Page API</h1>
        <button onclick="testAPI()">Test API</button>
        <div id="result"></div>
    </div>

    <script>
        const API_URL = 'https://doctor-appointment-backend-mq2p.onrender.com/api';

        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Loading...</p>';

            try {
                const response = await fetch(`${API_URL}/cms/about`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                console.log('API Response:', data);

                let html = `<div class="success">✅ API Success! Found ${data.length} sections</div>`;

                data.forEach(section => {
                    try {
                        const content = JSON.parse(section.contentJson);
                        html += `
                            <div class="section">
                                <h3>📄 Section: ${section.sectionKey}</h3>
                                <p><strong>Active:</strong> ${section.isActive}</p>
                                <p><strong>Content:</strong></p>
                                <pre>${JSON.stringify(content, null, 2)}</pre>
                            </div>
                        `;
                    } catch (e) {
                        html += `
                            <div class="error">
                                <h3>❌ Error parsing ${section.sectionKey}</h3>
                                <p>${e.message}</p>
                                <pre>${section.contentJson}</pre>
                            </div>
                        `;
                    }
                });

                resultDiv.innerHTML = html;

            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ API Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                console.error('API Error:', error);
            }
        }

        // Auto test on load
        window.onload = () => testAPI();
    </script>
</body>
</html>
