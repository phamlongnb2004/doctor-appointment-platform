<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test UTF-8 Encoding</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        pre {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Kiểm tra UTF-8 Encoding</h1>
    
    <div class="result">
        <h2>Test 1: API Response</h2>
        <div id="api-result">Đang tải...</div>
    </div>

    <div class="result">
        <h2>Test 2: Raw JSON</h2>
        <pre id="json-result">Đang tải...</pre>
    </div>

    <div class="result">
        <h2>Test 3: Hiển thị tiếng Việt</h2>
        <div id="display-result"></div>
    </div>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('http://localhost:8080/api/cms/news?limit=1');
                const data = await response.json();
                
                // Test 1: Check if data loaded
                const article = data[0];
                const apiResult = document.getElementById('api-result');
                
                if (article && article.title) {
                    apiResult.innerHTML = `
                        <p class="success">✓ API hoạt động</p>
                        <p><strong>Tiêu đề:</strong> ${article.title}</p>
                        <p><strong>Tác giả:</strong> ${article.author}</p>
                        <p><strong>Tóm tắt:</strong> ${article.excerpt}</p>
                    `;
                    
                    // Check if Vietnamese characters display correctly
                    if (article.title.includes('?') || article.author.includes('?')) {
                        apiResult.innerHTML += '<p class="error">✗ Lỗi encoding - có ký tự ?</p>';
                    } else if (article.title.match(/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i)) {
                        apiResult.innerHTML += '<p class="success">✓ Tiếng Việt hiển thị đúng!</p>';
                    } else {
                        apiResult.innerHTML += '<p class="error">✗ Không có ký tự tiếng Việt</p>';
                    }
                } else {
                    apiResult.innerHTML = '<p class="error">✗ Không tải được dữ liệu</p>';
                }
                
                // Test 2: Show raw JSON
                document.getElementById('json-result').textContent = JSON.stringify(data, null, 2);
                
                // Test 3: Display test
                document.getElementById('display-result').innerHTML = `
                    <p><strong>Test hiển thị:</strong></p>
                    <p>Tiêu đề: ${article.title}</p>
                    <p>Tác giả: ${article.author}</p>
                    <p>Tóm tắt: ${article.excerpt}</p>
                    <p>Các ký tự đặc biệt: àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ</p>
                `;
                
            } catch (error) {
                document.getElementById('api-result').innerHTML = `<p class="error">✗ Lỗi: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }

        // Run test when page loads
        testAPI();
    </script>
</body>
</html>
